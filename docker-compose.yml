version: '3.8'

services:
  # Next.js Application (Frontend + API)
  nextjs:
    build:
      context: ./nextjs-app
      dockerfile: Dockerfile
    container_name: speaker-nextjs
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - STORAGE_PATH=/app/storage
      - NODE_ENV=production
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3001
    volumes:
      - audio-storage:/app/storage

    networks:
      - speaker-net
    restart: unless-stopped

  # Python Worker for Audio Processing
  worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    container_name: speaker-worker
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - STORAGE_PATH=/app/storage
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_LANGUAGE=${ELEVENLABS_LANGUAGE:-}
    volumes:
      - audio-storage:/app/storage

    networks:
      - speaker-net
    restart: unless-stopped
    # Reduced resource limits since we're using cloud API
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

networks:
  speaker-net:
    driver: bridge
    name: speaker-net
    ipam:
      driver: default

volumes:
  audio-storage:
